debug: true

global:
  imageRegistry: "ecr-proxy.nexus.acceldata.tech"
  imagePullSecrets:
    - registry-ecr-secret

image:
  repository: acceldata/adoc/dp/helm-dashboard
  tag: "1.0.0"
  
dashboard:
  allowWriteActions: false
  clusterWide: false
  namespace: "{{ .Release.Namespace }}"

  persistence:
    enabled: false

envs:
  - name: HD_CLUSTER_MODE
    value: "true"

ingress:
  enabled: true
  className: "internal-kong"
  hosts:
    - host: helm.sentinel.acceldata.tech
      paths:
        - path: /
          pathType: ImplementationSpecific
